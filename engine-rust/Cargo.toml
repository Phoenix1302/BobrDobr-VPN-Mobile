[package]
name = "engine-rust"
version = "0.1.0"
edition = "2021"
authors = ["BobrDobr Mobile Team <hydrobiology@bobrdobr.org>"]
description = "High-performance zero-allocation TUN packet engine with AmneziaWG obfuscation"

[lib]
name = "engine_rust"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
blake2 = { version = "0.10", default-features = false }
tai64 = "4.0"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
